; Development PHP settings for the containerised site.
; The project's .htaccess sets upload limits inside <IfModule mod_php.c>, which
; does not match this image's module name, so they are set here instead.
upload_max_filesize = 16M
post_max_size = 20M
memory_limit = 256M
max_execution_time = 120

date.timezone = Asia/Tehran

; Show errors in the container log; the app decides what visitors see.
display_errors = Off
log_errors = On
error_log = /dev/stderr

; Pick up edits to bind-mounted source immediately.
opcache.enable = 1
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1
