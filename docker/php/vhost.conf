# Local development vhost. AllowOverride All is what lets the project's own
# .htaccess (front controller + hardening) take effect, exactly as on the
# shared-hosting target.
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Log to the container's stdout/stderr so `docker compose logs` shows them.
    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
